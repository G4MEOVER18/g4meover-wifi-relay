; G4MEOVER WiFi-Relay — ESP32-WROOM als ESP-NOW-Koordinator
; Rolle B des Oekosystems: Flipper --GPIO-UART--> WROOM --ESP-NOW--> LilyGo + Heltec v3
; (Rolle A "standalone USB-Penetrator" = eigenes Repo usb-army-penetrator)
[env:g4meover_wroom_relay]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D G4MEOVER_WIFI_RELAY
    ; Kanal, auf dem alle Satelliten lauschen (muss ueberall gleich sein)
    -D RELAY_ESPNOW_CHANNEL=1
    ; Flipper-GPIO-UART-Link: WROOM-RX<-Flipper-TX(Pin13), WROOM-TX->Flipper-RX(Pin14)
    ; Default Serial2 auf GPIO16/17 — je nach Devboard-Verdrahtung anpassen.
    -D FLIPPER_UART_RX=16
    -D FLIPPER_UART_TX=17
    -D FLIPPER_UART_BAUD=115200
